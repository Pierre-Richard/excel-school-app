spring.application.name=excel-school-java
server.port=8081


spring.datasource.url=jdbc:postgresql://localhost:5432/schoolapp_db
spring.datasource.username=postgres
spring.datasource.password=postgres


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=com.excelschool.config.PascalCaseNamingStrategy
spring.jpa.open-in-view=false
spring.jpa.show-sql=true


spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=schema EF Core existant
