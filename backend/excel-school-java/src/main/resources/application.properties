spring.application.name=excel-school-java
server.port=8081

# Même base que l'API .NET : le schéma existe déjà, créé par EF Core.
spring.datasource.url=jdbc:postgresql://localhost:5432/schoolapp_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate vérifie que chaque entité correspond à sa table, et ne modifie jamais le schéma.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=com.excelschool.config.PascalCaseNamingStrategy
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Flyway adopte le schéma existant comme version 1 ; les migrations à écrire commencent à V2.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=schema EF Core existant
